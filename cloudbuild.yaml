# Builds and deploys BOTH Cloud Run services on every push to master:
#   - backend  (src/, Express + Socket.IO API)  -> burn-backend service
#   - frontend (my-app/, static Vite build)     -> burn-frontend service
# (neither is named `default`-equivalent — burn-backend/burn-frontend are
# just this project's own service names, separate from anything else
# running in this project)
#
# The backend deploys FIRST and the frontend SECOND — deliberately, not
# alphabetically: the frontend's build needs to bake the backend's Cloud Run
# URL in as VITE_API_BASE_URL (see src/config.ts), and that URL only exists
# once the backend service does. Cloud Run URLs are stable once a service
# exists (a redeploy doesn't change it), so this "read it back right after
# deploying" step works the same on the very first run as on every run
# after.
#
# Wire this up to a Cloud Build trigger on push to `master`
# (config file location: /cloudbuild.yaml), and set these substitution
# variables on that trigger:
#   _MONGODB_URI  the real Mongo connection string (no default here on
#                 purpose — see backend-render-env below, it fails loudly
#                 rather than silently deploying with no database)
#   _REGION       defaults to europe-west3 below (inferred from this
#                 project's existing App Engine app's region) — double
#                 check that's actually right for you (`gcloud run services
#                 list` or the Cloud Run console) and override on the
#                 trigger if not; Cloud Run is regional per-service, unlike
#                 App Engine's single app-wide region.
# A plain trigger substitution for _MONGODB_URI is visible in the build's
# logs/history — move it to a Secret Manager-backed secret (`--set-secrets`
# on backend-deploy below) instead if that's not acceptable.
#
# One-time prerequisites this file assumes are already done:
#   - Cloud Run API, Artifact Registry API, and Cloud Build API all enabled
#     on the project.
#   - the Cloud Build service account (a custom one, if your trigger is
#     configured with one, rather than the default
#     PROJECT_NUMBER@cloudbuild.gserviceaccount.com) has, at minimum:
#       - roles/run.admin — deploy/manage the services, including making
#         them public (see --allow-unauthenticated below).
#       - roles/iam.serviceAccountUser — to deploy AS the runtime service
#         account named below.
#       - roles/cloudbuild.builds.editor — `gcloud run deploy --source`
#         doesn't build the container itself, it submits a SEPARATE, nested
#         Cloud Build job to do that via buildpacks (the same thing
#         `gcloud builds submit --pack` does) — this is what lets the
#         calling identity submit that nested build.
#       - roles/artifactregistry.admin — a `--source` deploy pushes the
#         built image to Artifact Registry, auto-creating a
#         `cloud-run-source-deploy` repo the first time any service in the
#         project deploys this way. roles/artifactregistry.writer can push
#         to an EXISTING repo but can't create a new one, which is exactly
#         what's needed on that very first deploy — either grant .admin, or
#         have someone with sufficient rights pre-create the repo once
#         (`gcloud artifactregistry repositories create
#         cloud-run-source-deploy --repository-format=docker
#         --location=$REGION`), after which .writer is enough from then on.
#     Don't count on the gcloud error message to name which of these is
#     missing — "PERMISSION_DENIED: The caller does not have permission" is
#     all it says. To find the actual permission that got denied, check
#     Cloud Logging for the failed build's timestamp, filtered to
#     `protoPayload.status.code=7` — the audit log entry's
#     `authorizationInfo` names the exact permission (e.g.
#     `run.services.create`, `artifactregistry.repositories.create`).
#   - if your org has a policy restricting public (allUsers) Cloud Run
#     access, --allow-unauthenticated below will fail even with the right
#     IAM roles — that's an org policy exception, not something this file
#     can work around.

substitutions:
  _MONGODB_URI: "" # real value comes from the trigger config; empty here just avoids a hard failure on an ad-hoc manual build
  _REGION: "europe-west3"

steps:
  # ---------------- backend: src/ -> burn-backend service ----------------
  - id: backend-install
    name: 'gcr.io/cloud-builders/npm'
    args: ['ci']

  # Fails the build here (before touching Cloud Run) if the TypeScript
  # doesn't compile. The buildpack backing `gcloud run deploy --source`
  # also runs this via the `gcp-build` script, so this step is mainly fast
  # feedback.
  - id: backend-build
    name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'build']

  # Writes the backend's runtime env vars to a file for backend-deploy's
  # --env-vars-file, rather than passing --set-env-vars=KEY=VAL,KEY2=VAL2
  # directly: that flag's own syntax treats a bare comma as the delimiter
  # between vars, and a Mongo URI can itself contain one (a multi-host
  # replica-set connection string, e.g. mongodb://host1,host2,host3/db) —
  # same class of corruption risk as the `&` in a query string, just for a
  # different tool. Writing it out with JSON.stringify (valid YAML) takes
  # the value verbatim regardless of what characters it contains.
  - id: backend-render-env
    name: 'gcr.io/cloud-builders/npm'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -z "$$MONGODB_URI" ]; then
          echo 'ERROR: _MONGODB_URI substitution is not set on the trigger' >&2
          exit 1
        fi
        # Prints only a safe prefix + total length, never the full value,
        # so a bad substitution (wrong scheme, stray quotes, truncation)
        # shows up in the build log without leaking the secret.
        echo "MONGODB_URI starts with '$${MONGODB_URI:0:14}' ($${#MONGODB_URI} chars total)"
        node -e "
          const fs = require('fs');
          fs.writeFileSync('/workspace/backend-env.yaml', JSON.stringify({
            NODE_ENV: 'production',
            MONGODB_URI: process.env.MONGODB_URI,
          }));
        "
    env:
      - 'MONGODB_URI=${_MONGODB_URI}'

  # `--source=.` hands the current directory to the same Google Cloud
  # buildpacks that were already building this app for App Engine Flex
  # (npm ci, then the `gcp-build` script -> tsc, then `npm start` -> node
  # dist/server.js as the container's entrypoint) — no Dockerfile needed.
  #
  # Flags translate the old app.yaml's settings:
  #   --allow-unauthenticated   there's no login (see CLAUDE.md) — a room's
  #                             link IS the access control, so the API has
  #                             to be reachable by anyone with it, same as
  #                             it was on App Engine.
  #   --session-affinity        Socket.IO's connection state (and its
  #                             polling-transport fallback) lives in one
  #                             instance's memory — this is Cloud Run's
  #                             equivalent of app.yaml's
  #                             network.session_affinity: true, keeping a
  #                             client pinned to the instance holding it.
  #   --no-cpu-throttling       Cloud Run only guarantees CPU while
  #                             actively handling request bytes by default;
  #                             an open-but-idle WebSocket between
  #                             Socket.IO's own ping/pong heartbeats needs
  #                             CPU available in the gaps too, or those
  #                             heartbeats can stall and the client sees a
  #                             spurious disconnect. This keeps CPU
  #                             allocated for the life of the container,
  #                             not just mid-request — the tradeoff is
  #                             you're billed for that too (see min/max
  #                             instances below for the other half of that
  #                             tradeoff).
  #   --timeout=3600            Cloud Run's cap on a single request's
  #                             lifetime, which a WebSocket counts against
  #                             — set to the maximum Cloud Run allows so a
  #                             connection is forced to reconnect as
  #                             rarely as possible. The frontend already
  #                             handles this fine either way: it re-emits
  #                             joinRoom on every socket 'connect',
  #                             including reconnects (see NoteList.tsx).
  #   --concurrency=80          Cloud Run's default — each open socket
  #                             occupies one concurrency slot for as long
  #                             as it's connected, so this is "how many
  #                             simultaneous users one instance holds
  #                             before Cloud Run starts another", not a
  #                             per-request throughput number. 80 is
  #                             plenty for this app's expected traffic;
  #                             written out explicitly here rather than
  #                             left implicit so the number is visible.
  #   --min-instances=0         Scales to zero when no room is open
  #                             anywhere — cheaper than App Engine Flex's
  #                             always-on min_num_instances: 1, at the
  #                             cost of a few seconds' cold start for
  #                             whoever's the first to open a room after a
  #                             quiet stretch. A deliberate choice for a
  #                             low-traffic app — bump to 1 if that
  #                             cold-start latency ever becomes a problem.
  #   --service-account         reuses the exact App Engine default
  #                             service account this app already ran as
  #                             under Flex, rather than introducing a new
  #                             identity to provision — the backend only
  #                             talks to MongoDB via a plain connection
  #                             string, no other GCP API calls, so it
  #                             doesn't need any different permissions
  #                             either way.
  - id: backend-deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Without this, a failed `gcloud run deploy` below wouldn't stop the
        # script — it'd fall through to `gcloud run services describe`
        # (which would also fail, since nothing got deployed), then the
        # final `echo` would still exit 0, so Cloud Build would log this
        # whole step as *succeeded* despite nothing having deployed. That's
        # exactly what let a real run limp forward into building the
        # frontend against an empty VITE_API_BASE_URL instead of stopping
        # here where the actual problem was.
        set -euo pipefail
        gcloud run deploy burn-backend \
          --source=. \
          --region=${_REGION} \
          --service-account=${PROJECT_ID}@appspot.gserviceaccount.com \
          --allow-unauthenticated \
          --session-affinity \
          --no-cpu-throttling \
          --timeout=3600 \
          --concurrency=80 \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=4 \
          --env-vars-file=/workspace/backend-env.yaml \
          --quiet
        # Stable once the service exists — a later redeploy doesn't change
        # it — so reading it back here works identically on the first run
        # (service just got created above) and every run after.
        gcloud run services describe burn-backend --region=${_REGION} --format='value(status.url)' > /workspace/backend-url.txt
        echo "burn-backend deployed at: $(cat /workspace/backend-url.txt)"

  # ---------------- frontend: my-app/ -> burn-frontend service ----------------
  - id: frontend-install
    name: 'gcr.io/cloud-builders/npm'
    dir: 'my-app'
    args: ['ci']

  - id: frontend-build
    name: 'gcr.io/cloud-builders/npm'
    dir: 'my-app'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        export VITE_API_BASE_URL="$(cat /workspace/backend-url.txt)"
        # Belt-and-suspenders: backend-deploy failing fast (see set -euo
        # pipefail there) should already stop the build before this step
        # ever runs, but check anyway rather than silently shipping a
        # frontend that falls back to localhost in production (see
        # src/config.ts) if that file ever comes back empty for some other
        # reason.
        if [ -z "$$VITE_API_BASE_URL" ]; then
          echo 'ERROR: backend URL is empty — backend-deploy did not write /workspace/backend-url.txt correctly' >&2
          exit 1
        fi
        echo "Building frontend against VITE_API_BASE_URL=$$VITE_API_BASE_URL"
        npm run build

  # `--source=my-app` again uses the buildpack (no Dockerfile): its
  # `gcp-build` script is a deliberate no-op (see my-app/package.json) that
  # reuses the dist/ frontend-build just produced instead of letting the
  # buildpack run `vite build` itself, which wouldn't have
  # VITE_API_BASE_URL set. `npm start` -> `serve -s dist` is then the
  # container's entrypoint — `serve` already respects Cloud Run's PORT env
  # var and binds 0.0.0.0 by default, and `-s` is `serve`'s SPA flag (any
  # unmatched path falls back to index.html, same as App Engine's old `/.*`
  # handler), so no Dockerfile or extra config is needed here either.
  - id: frontend-deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'burn-frontend'
      - '--source=my-app'
      - '--region=${_REGION}'
      - '--service-account=${PROJECT_ID}@appspot.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=256Mi'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--quiet'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
