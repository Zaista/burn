# GCP App Engine config for the frontend (static Vite build in dist/,
# rebuilt by cloudbuild.yaml before this deploy). Deployed as the named
# `burn-frontend` service (not `default` — that's already this project's
# portfolio site), so shared room links resolve at
# https://burn-frontend-dot-PROJECT_ID.appspot.com/room/:id. The API
# backend is the sibling `burn-backend` service — see ../app.yaml —
# reachable at https://burn-backend-dot-PROJECT_ID.appspot.com; that URL
# is baked into the build via VITE_API_BASE_URL (see src/config.ts).
runtime: nodejs24
env: standard
service: burn-frontend

# Every route is served as a static file directly by App Engine's routing
# layer, without ever invoking application code — the `start` script
# below (see package.json) only exists as a fallback for whatever the
# standard Node runtime's own startup check may need.
handlers:
  - url: /assets
    static_dir: dist/assets
    secure: always

  # SPA fallback: anything else (/, /room/:id, a hard refresh mid-route)
  # gets index.html and react-router takes over client-side.
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 2
